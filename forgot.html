<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<section class="main-container">

    <div class="login-section">
        <div class="login-card">
            <h2>Recuperar Senha</h2>
            <form id="forgotForm">
                <div class="form-group">
                    <input type="email" id="emailForgot" placeholder="Digite seu e-mail" required>
                </div>
                <button type="submit" class="btn-login">Enviar link</button>
            </form>
            <button class="btn-forgot" onclick="window.location.href='index.html'">Voltar ao login</button>
        </div>
    </div>

</section>

<script src="utils.js"></script>
<script src="api.js"></script>
<script src="forgot.js"></script>
</body>
</html>
