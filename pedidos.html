<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='home.html'">
        <img src="img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <nav class="menu" id="menu">
        <!-- O menu será preenchido pelo JS -->
    </nav>
</header>

<section class="services-section">
    <!-- PAINEL DE RESUMO (DASHBOARD) -->
    <div id="dashboard-prestador" style="display: none;">
        <h2 style="margin-bottom: 20px; text-align: left; color: #EEEEEE;">Meu Painel</h2>
        <div class="dashboard-container">
            <div class="dashboard-card">
                <h3>Ganhos Totais</h3>
                <div class="dashboard-value" id="dash-ganhos">R$ 0,00</div>
            </div>
            <div class="dashboard-card">
                <h3>Serviços Concluídos</h3>
                <div class="dashboard-value" id="dash-concluidos">0</div>
            </div>
            <div class="dashboard-card">
                <h3>Média de Avaliações</h3>
                <div class="dashboard-value" id="dash-avaliacoes">★ N/A</div>
            </div>
        </div>
    </div>

    <!-- Seção de solicitações recebidas (visível apenas para prestadores) -->
    <div id="recebidos-section" style="display: none; margin-bottom: 40px;">
        <h2 id="titulo-pedidos-recebidos">Solicitações Recebidas</h2>
        <div class="filtros-pedidos">
            <select id="filtro-status-recebidos">
                <option value="todos">Filtrar por Status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ACEITO">Aceito</option>
                <option value="AGUARDANDO_CONFIRMACAO">Aguard. Confirmação</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <select id="ordenar-data-recebidos">
                <option value="recentes">Mais Recentes</option>
                <option value="antigos">Mais Antigos</option>
            </select>
        </div>
        <div id="pedidos-recebidos-container" class="pedidos-grid">
            <!-- Cards de solicitações recebidas -->
        </div>
    </div>

    <!-- Seção de solicitações enviadas (visível para todos) -->
    <div id="enviados-section">
        <h2 id="titulo-pedidos-enviados">Meus Pedidos Realizados</h2>
        <div class="filtros-pedidos">
            <select id="filtro-status-enviados">
                <option value="todos">Filtrar por Status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ACEITO">Aceito</option>
                <option value="AGUARDANDO_CONFIRMACAO">Aguard. Confirmação</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <select id="ordenar-data-enviados">
                <option value="recentes">Mais Recentes</option>
                <option value="antigos">Mais Antigos</option>
            </select>
        </div>
        <div id="pedidos-enviados-container" class="pedidos-grid">
            <!-- Cards de solicitações enviadas -->
        </div>
    </div>
</section>

<script src="utils.js"></script>
<script src="pedidos.js"></script>

<!-- MODAL DO CHAT -->
<div id="chatModal" class="modal">
    <div class="modal-content" style="height: 80vh;">
        <span class="close-button">&times;</span>
        <h3 id="chat-header">Conversa</h3>
        
        <!-- ÁREA DE NEGOCIAÇÃO -->
        <div id="negociacao-area" style="background: #222A31; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #00ADB5; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
            <!-- Preenchido via JS -->
        </div>

        <div id="chat-messages" class="chat-messages">
            <!-- Mensagens serão carregadas aqui -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
            <button id="chat-send-btn">Enviar</button>
        </div>
    </div>
</div>

</body>
</html>
