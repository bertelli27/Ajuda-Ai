<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Serviços | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='home.html'">
        <img src="img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <nav class="menu" id="menu">
        <!-- O menu será preenchido pelo JS -->
    </nav>
</header>

<section class="services-section">
    <h2 style="margin-bottom: 20px; text-align: left;">Meus Serviços</h2>

    <div class="tabs-container">
        <button class="tab-btn active" id="btnTabContratados">Contratados</button>
        <button class="tab-btn" id="btnTabPrestados" style="display: none;">Prestados</button>
    </div>

    <!-- Seção de solicitações enviadas (Contratados) -->
    <div id="enviados-section">
        <div class="filtros-pedidos">
            <select id="filtro-status-enviados">
                <option value="todos">Filtrar por Status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ACEITO">Aceito</option>
                <option value="AGUARDANDO_CONFIRMACAO">Aguard. Confirmação</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <select id="ordenar-data-enviados">
                <option value="recentes">Mais Recentes</option>
                <option value="antigos">Mais Antigos</option>
            </select>
        </div>
        <div class="pedidos-wrapper">
            <div id="pedidos-enviados-container" class="pedidos-grid">
                <!-- Cards de solicitações enviadas -->
            </div>
            <div id="paginacao-enviados" class="pagination-controls"></div>
        </div>
    </div>

    <!-- Seção de solicitações recebidas (Prestados) -->
    <div id="recebidos-section" style="display: none;">
        <div class="filtros-pedidos">
            <select id="filtro-status-recebidos">
                <option value="todos">Filtrar por Status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ACEITO">Aceito</option>
                <option value="AGUARDANDO_CONFIRMACAO">Aguard. Confirmação</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <select id="ordenar-data-recebidos">
                <option value="recentes">Mais Recentes</option>
                <option value="antigos">Mais Antigos</option>
            </select>
        </div>
        <div class="pedidos-wrapper">
            <div id="pedidos-recebidos-container" class="pedidos-grid">
                <!-- Cards de solicitações recebidas -->
            </div>
            <div id="paginacao-recebidos" class="pagination-controls"></div>
        </div>
    </div>
</section>

<footer class="mini-footer">
    &copy; 2026 AjudaAí. Todos os direitos reservados.
</footer>

<script src="utils.js"></script>
<script src="pedidos.js"></script>

<!-- MODAL DO CHAT -->
<div id="chatModal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <div class="chat-header-container">
            <h3 id="chat-header">Conversa</h3>
            <button id="btnToggleOrcamento" class="btn-orcamento"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Orçamento</button>
        </div>
        
        <!-- ÁREA DE NEGOCIAÇÃO -->
        <div id="orcamento-overlay" class="orcamento-overlay" style="display: none;">
            <div class="negociacao-box">
                <button type="button" id="fechar-orcamento-btn" class="close-orcamento-btn" data-tooltip="Fechar Orçamento" data-tooltip-dir="left">&times;</button>
                <div id="negociacao-area">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>

        <div id="chat-view">
            <div id="chat-messages" class="chat-messages">
                <!-- Mensagens serão carregadas aqui -->
            </div>
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <label for="chat-image-input" class="btn-attach" data-tooltip="Anexar Imagem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00ADB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </label>
                    <input type="file" id="chat-image-input" accept="image/png, image/jpeg" style="display: none;">
                    <textarea id="chat-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
                </div>
                <button id="chat-send-btn">Enviar</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
