<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Serviços | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='index.html'">
        <img src="img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <nav class="menu" id="menu">
        <!-- O menu será preenchido pelo JS -->
    </nav>
</header>

<section class="services-section">
    <h2 style="margin-bottom: 20px; text-align: left;">Meus Serviços</h2>

    <div class="tabs-container">
        <button class="tab-btn active" id="btnTabContratados">Contratados</button>
        <button class="tab-btn" id="btnTabPrestados" style="display: none;">Prestados</button>
    </div>

    <!-- Seção de solicitações enviadas (Contratados) -->
    <div id="enviados-section">
        <div class="filtros-pedidos">
            <select id="filtro-status-enviados">
                <option value="todos">Filtrar por Status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ACEITO">Aceito</option>
                <option value="AGUARDANDO_CONFIRMACAO">Aguard. Confirmação</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <select id="ordenar-data-enviados">
                <option value="recentes">Mais Recentes</option>
                <option value="antigos">Mais Antigos</option>
            </select>
        </div>
        <div class="pedidos-wrapper">
            <div id="pedidos-enviados-container" class="pedidos-grid">
                <!-- Cards de solicitações enviadas -->
            </div>
            <div id="paginacao-enviados" class="pagination-controls"></div>
        </div>
    </div>

    <!-- Seção de solicitações recebidas (Prestados) -->
    <div id="recebidos-section" style="display: none;">
        <div class="filtros-pedidos">
            <select id="filtro-status-recebidos">
                <option value="todos">Filtrar por Status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ACEITO">Aceito</option>
                <option value="AGUARDANDO_CONFIRMACAO">Aguard. Confirmação</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <select id="ordenar-data-recebidos">
                <option value="recentes">Mais Recentes</option>
                <option value="antigos">Mais Antigos</option>
            </select>
        </div>
        <div class="pedidos-wrapper">
            <div id="pedidos-recebidos-container" class="pedidos-grid">
                <!-- Cards de solicitações recebidas -->
            </div>
            <div id="paginacao-recebidos" class="pagination-controls"></div>
        </div>
    </div>
</section>

<footer class="mini-footer">
    &copy; 2026 AjudaAí. Todos os direitos reservados.
</footer>

<script src="utils.js"></script>
<script src="api.js"></script>
<script src="pedidos.js"></script>

<!-- MODAL DO CHAT -->
<div id="chatModal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <div class="chat-header-container">
            <h3 id="chat-header">Conversa</h3>
            <button id="btnToggleOrcamento" class="btn-orcamento"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Orçamento</button>
        </div>
        
        <!-- ÁREA DE NEGOCIAÇÃO -->
        <div id="orcamento-overlay" class="orcamento-overlay" style="display: none;">
            <div class="negociacao-box">
                <button type="button" id="fechar-orcamento-btn" class="close-orcamento-btn" data-tooltip="Fechar Orçamento" data-tooltip-dir="left">&times;</button>
                <div id="negociacao-area">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>

        <div id="chat-view">
            <div id="chat-messages" class="chat-messages">
                <!-- Mensagens serão carregadas aqui -->
            </div>
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <label for="chat-image-input" class="btn-attach" data-tooltip="Anexar Imagem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00ADB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </label>
                    <input type="file" id="chat-image-input" accept="image/png, image/jpeg" style="display: none;">
                    <textarea id="chat-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
                </div>
                <button id="chat-send-btn">Enviar</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE PAGAMENTO SIMULADO -->
<div id="pagamentoModal" class="modal">
    <div class="modal-content" style="overflow-y: auto;">
        <span class="close-button" id="closePagamentoModal" onclick="document.getElementById('pagamentoModal').style.display='none'">&times;</span>
        <h3 style="color: #00ADB5; margin-bottom: 20px; font-size: 24px;">Finalizar Pagamento</h3>
        
        <!-- Resumo do Pedido (Novo Layout Premium) -->
        <div style="background: rgba(0, 173, 181, 0.05); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(0, 173, 181, 0.2);">
            <h4 id="pagamentoServicoTitulo" style="color: #EEEEEE; margin-bottom: 5px; font-size: 18px;">Nome do Serviço</h4>
            <p style="color: #AAAAAA; font-size: 14px; margin-bottom: 15px;">Profissional: <strong id="pagamentoPrestadorNome" style="color: #EEEEEE;">Nome</strong></p>
            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1);">
                <span style="font-weight: 500; color: #CCCCCC;">Total a Pagar:</span>
                <span id="pagamentoValorTotal" style="font-size: 28px; font-weight: 700; color: #5cb85c;">R$ 0,00</span>
            </div>
        </div>

        <!-- Toggle de Seleção -->
        <div class="payment-methods">
            <div class="payment-method">
                <input type="radio" name="metodoPagamento" id="payPix" value="pix" checked>
                <label for="payPix">PIX</label>
            </div>
            <div class="payment-method">
                <input type="radio" name="metodoPagamento" id="payCartao" value="cartao">
                <label for="payCartao">Cartão de Crédito</label>
            </div>
        </div>

        <!-- ÁREA DO PIX -->
        <div id="areaPix" style="text-align: center; padding: 40px 20px; background: #2A343D; border-radius: 10px; border: 1px solid #4F5B66;">
            <p style="margin-bottom: 25px; font-size: 16px; color: #AAAAAA;">Escaneie o QR Code ou copie a chave PIX abaixo.</p>
            <!-- Imagem genérica de QR Code para simulação -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=PagamentoSimuladoAjudaAi" alt="QR Code PIX" style="border-radius: 8px; border: 4px solid #fff; margin-bottom: 25px; width: 220px; height: 220px;">
            <div style="display: flex; gap: 10px;">
                <input type="text" value="0002012636br.gov.bcb.pix..." readonly style="flex-grow: 1; padding: 10px; background: #222A31; border: 1px solid #4F5B66; border-radius: 8px; color: #EEE;">
                <button type="button" class="btn-forgot" style="width: auto; margin: 0; padding: 10px 15px;" onclick="mostrarToast('Chave PIX copiada!', 'success')">Copiar</button>
            </div>
        </div>

        <!-- ÁREA DO CARTÃO -->
        <div id="areaCartao" style="display: none; padding: 40px 30px; background: #2A343D; border-radius: 10px; border: 1px solid #4F5B66;">
            <div class="form-grid" style="margin-bottom: 0;">
                <div class="form-group full-width">
                    <label>Número do Cartão</label>
                    <input type="text" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="form-group full-width">
                    <label>Nome do Titular</label>
                    <input type="text" placeholder="NOME COMO ESTÁ NO CARTÃO">
                </div>
                <div class="form-group">
                    <label>Validade</label>
                    <input type="text" placeholder="MM/AA" maxlength="5">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="password" placeholder="123" maxlength="4">
                </div>
            </div>
        </div>

        <!-- Spacer para empurrar o botão para o fundo se a tela for grande -->
        <div style="flex-grow: 1;"></div>

        <button type="button" id="btnConfirmarPagamentoSimulado" class="btn-login" style="margin-top: 30px; font-size: 18px; padding: 18px;">Confirmar Pagamento</button>
    </div>
</div>

</body>
</html>
