<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Serviço | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='home.html'">
        <img src="img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <!-- HEADER DINÂMICO APÓS LOGIN -->
    <nav class="menu" id="menu">
        <!-- O menu será preenchido pelo JS -->
    </nav>
</header>

<section class="main-container" style="min-height: auto; padding-top: 40px;">

    <div class="login-section register-section">
        <div class="login-card">
            <h2>Solicitar Serviço</h2>
            
            <h3 class="section-title">Informações do Profissional</h3>
            <div id="infoPrestador" style="background: #222A31; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; border: 1px solid #00ADB5;">
                <!-- Preenchido via JS -->
            </div>

            <form id="formSolicitacao">
                <h3 class="section-title">Detalhes do Pedido</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="descricaoProblema">O que você precisa?</label>
                        <!-- Removemos os estilos inline para usar os do CSS (style.css) -->
                        <textarea id="descricaoProblema" placeholder="Descreva detalhadamente o serviço necessário..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="dataDesejada">Data Desejada</label>
                        <input type="date" id="dataDesejada" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="enderecoLocal">Endereço de Realização</label>
                        <input type="text" id="enderecoLocal" placeholder="Endereço completo" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 10px;">Confirmar Solicitação</button>
                <button type="button" class="btn-forgot" onclick="window.history.back()" style="margin-top: 10px;">Cancelar e Voltar</button>
            </form>
        </div>
    </div>

</section>
<script src="utils.js"></script>
<script src="solicitar.js"></script>
</body>
</html>
