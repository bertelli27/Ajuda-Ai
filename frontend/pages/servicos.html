<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços | AjudaAí</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='index.html'">
        <img src="../img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <!-- HEADER DINÂMICO -->
    <nav class="menu" id="menu">
        <!-- O menu será preenchido pelo JS -->
    </nav>
</header>

<section class="search-section">
    <input type="text" placeholder="Pesquisar por serviço, nome ou cidade..." id="searchInput">
    <button id="searchBtn">Buscar</button>
</section>

<!-- Assistente de IA Separado -->
<section class="assistant-search-section">
    <div class="assistant-search-card">
        <h4>✨ Assistente Inteligente</h4>
        <p>Não sabe de qual profissional precisa? Descreva o seu problema abaixo que o assistente encontra a categoria certa:</p>
        <div class="assistant-search-row">
            <textarea id="ia-descricao-problema" class="assistant-search-input" rows="2" placeholder="Ex: Minha torneira não para de pingar água no banheiro..."></textarea>
            <button type="button" id="btnSugerirServico" class="btn-service assistant-search-btn">Analisar Problema</button>
        </div>
        <div id="ia-resultado" class="assistant-result-box" style="display: none;">
            <p style="margin-bottom: 8px; font-weight: 500;">Categoria sugerida: <strong id="ia-categoria-texto" style="color: #00ADB5; font-size: 18px;"></strong></p>
            <p id="ia-explicacao" style="opacity: 0.85; font-size: 14px; margin-bottom: 8px;"></p>
            <p id="ia-orientacao" style="display: none; opacity: 0.75; font-size: 13px; margin-bottom: 12px; font-style: italic;"></p>
            <ul id="ia-profissionais-lista" style="list-style: none; padding: 0; margin: 0 0 15px 0;"></ul>
            <button type="button" id="btnUsarSugestao" class="btn-login" style="padding: 10px 20px; font-size: 14px; width: auto;">Filtrar Profissionais</button>
        </div>
    </div>
</section>

<section class="services-section">
    <div class="categorias-container" id="filtrosCategoria">
        <button class="btn-categoria active" data-cat="Todos">Todos</button>
        <button class="btn-categoria" data-cat="Limpeza">Limpeza</button>
        <button class="btn-categoria" data-cat="Manutenção">Manutenção</button>
        <button class="btn-categoria" data-cat="Reformas">Reformas</button>
        <button class="btn-categoria" data-cat="Tecnologia">Tecnologia</button>
        <button class="btn-categoria" data-cat="Saúde e Beleza">Saúde e Beleza</button>
        <button class="btn-categoria" data-cat="Outros">Outros</button>
    </div>

    <h2>Todos os Serviços Disponíveis</h2>
    <div class="services-grid">
        <!-- OS CARDS SERÃO INSERIDOS AQUI VIA JAVASCRIPT -->
    </div>
    <div id="paginacao-servicos" class="pagination-controls"></div>
</section>

<footer class="mini-footer">
    &copy; 2026 AjudaAí. Todos os direitos reservados.
</footer>

<script defer src="../js/api.js"></script>
<script defer src="../js/utils.js"></script>
<script defer src="../js/servicos.js"></script>
</body>
</html>
