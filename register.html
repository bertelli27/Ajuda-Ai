<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<section class="main-container">

    <div class="login-section register-section">
        <div class="login-card">
            <h2>Criar Conta</h2>
            <form id="registerForm">
                <div class="form-grid">
                    <h3 class="section-title full-width">Informações Pessoais</h3>
                    <div class="form-group full-width">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Ex: João da Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required maxlength="14">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" placeholder="(11) 90000-0000" required maxlength="15">
                    </div>
                    <div class="form-group full-width">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                    
                    <!-- Endereço (Preenchimento ViaCEP) -->
                    <h3 class="section-title full-width">Endereço</h3>
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" placeholder="Apenas números" required maxlength="9">
                    </div>
                    <div class="form-group">
                        <label for="rua">Logradouro / Rua</label>
                        <input type="text" id="rua" placeholder="Rua" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123, Bloco B" required>
                    </div>
                    <div class="form-group">
                        <label for="complemento">Complemento (Opcional)</label>
                        <input type="text" id="complemento" placeholder="Ponto de Referência">
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" placeholder="Bairro" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" placeholder="Cidade" readonly required>
                    </div>
                    <div class="form-group full-width">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" placeholder="Estado" readonly required>
                    </div>

                    <h3 class="section-title full-width">Segurança da Conta</h3>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Crie uma senha segura" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmSenha">Confirmar Senha</label>
                        <input type="password" id="confirmSenha" placeholder="Repita a senha" required>
                    </div>
                </div>

                <!-- Tipo de Usuário -->
                <h3 class="section-title full-width" style="margin-top: 15px;">Finalidade da Conta</h3>
                <div class="remember full-width" style="display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap;">
                    <label style="font-size: 16px;"><input type="radio" name="tipoUsuario" value="cliente" checked> Quero Contratar (Cliente)</label>
                    <label style="font-size: 16px;"><input type="radio" name="tipoUsuario" value="prestador"> Quero Trabalhar (Prestador)</label>
                </div>

                <!-- Campos Extras para Prestador -->
                <div id="camposPrestador" style="display: none;">
                    <h3 class="section-title full-width">Dados Profissionais</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="categoria">Categoria Principal</label>
                            <select id="categoria">
                                <option value="" disabled selected>Selecione uma Categoria...</option>
                                <option value="Limpeza">Limpeza</option>
                                <option value="Manutenção">Manutenção</option>
                                <option value="Reformas">Reformas</option>
                                <option value="Tecnologia">Tecnologia</option>
                                <option value="Saúde e Beleza">Saúde e Beleza</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label for="servico">Nome do Serviço</label>
                            <input type="text" id="servico" placeholder="Ex: Eletricista Residencial">
                        </div>
                        <div class="form-group full-width">
                            <label for="descricao">Descrição Rápida</label>
                            <input type="text" id="descricao" placeholder="Fale um pouco sobre sua experiência">
                        </div>
                        <div class="form-group">
                            <label for="valor">Valor Médio (R$)</label>
                            <input type="number" id="valor" placeholder="Ex: 150">
                        </div>
                        <div class="form-group">
                            <label for="disponibilidade">Disponibilidade</label>
                            <input type="text" id="disponibilidade" placeholder="Ex: Seg a Sex, 08h as 18h">
                        </div>
                    </div>
                </div>

                <div class="remember">
                    <label>
                        <input type="checkbox" id="lembrarContaRegister">
                        Lembrar da conta
                    </label>
                </div>
                <button type="submit" class="btn-login">Cadastrar</button>
            </form>

            <p class="create-account">
                Já tem uma conta? <a href="index.html">Faça login</a>
            </p>
        </div>
    </div>

</section>

<script src="utils.js"></script>
<script src="cep.js"></script>
<script src="register.js"></script>
</body>
</html>
