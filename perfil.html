<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='home.html'">
        <img src="img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <!-- HEADER DINÂMICO APÓS LOGIN -->
    <nav class="menu" id="menu">
        <a href="home.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="pedidos.html">Meus Pedidos</a>
        <a href="perfil.html">Meu Perfil</a>
        <a href="#" id="btnLogout">Sair</a>
    </nav>
</header>

<section class="main-container" style="min-height: auto; padding-top: 40px;">

    <div class="login-section register-section">
        <div class="login-card">
            <h2>Meu Perfil</h2>
            <form id="perfilForm">
                <div class="form-grid">
                    <input type="text" id="nome" placeholder="Nome completo" required class="full-width" disabled>
                    
                    <!-- Campos não editáveis -->
                    <input type="text" id="cpf" placeholder="CPF" required disabled>
                    <input type="email" id="email" placeholder="E-mail" required disabled>

                    <input type="tel" id="telefone" placeholder="Telefone" required maxlength="15" disabled>
                    <input type="text" id="cep" placeholder="CEP" required maxlength="9" disabled>
                    
                    <!-- Endereço -->
                    <input type="text" id="rua" placeholder="Rua" required class="full-width" disabled>
                    <input type="text" id="numero" placeholder="Número" required>
                    <input type="text" id="complemento" placeholder="Complemento/Referência" disabled>
                    <input type="text" id="bairro" placeholder="Bairro" required disabled>
                    <input type="text" id="cidade" placeholder="Cidade" required disabled>
                    <input type="text" id="estado" placeholder="Estado" required disabled>
                </div>

                <!-- Opção para se tornar prestador (Visível apenas para clientes) -->
                <div id="areaTornarPrestador" style="display: none; margin-top: 10px; margin-bottom: 10px;">
                    <button type="button" id="btnTornarPrestador" class="btn-forgot" style="width: 100%;">Quero Oferecer Meus Serviços (Tornar-se Prestador)</button>
                </div>

                <!-- Se for prestador, mostrar os campos dele -->
                <div id="camposPrestadorPerfil" style="display: none; margin-top: 15px;" class="form-grid">
                    <h3 class="full-width" style="color: #00ADB5; margin-bottom: 0; text-align: left;">Dados de Prestador</h3>
                    <select id="categoria" class="full-width" disabled style="padding: 12px; border-radius: 8px; border: 1px solid #00ADB5; background: #222A31; color: #EEEEEE; outline: none;">
                        <option value="" disabled selected>Selecione uma Categoria...</option>
                        <option value="Limpeza">Limpeza</option>
                        <option value="Manutenção">Manutenção</option>
                        <option value="Reformas">Reformas</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Saúde e Beleza">Saúde e Beleza</option>
                        <option value="Outros">Outros</option>
                    </select>
                    <input type="text" id="servico" placeholder="Serviço prestado" class="full-width" disabled>
                    <input type="text" id="descricao" placeholder="Descrição rápida" class="full-width" disabled>
                    <input type="number" id="valor" placeholder="Valor médio por serviço (R$)" disabled>
                    <input type="text" id="disponibilidade" placeholder="Disponibilidade" disabled>
                </div>

                <button type="submit" id="btnSalvar" class="btn-login" style="display: none; margin-top: 20px;">Salvar Alterações</button>
            </form>
            <button id="btnEditar" class="btn-forgot" style="margin-top: 20px;">Editar Dados</button>

            <!-- Seção de Avaliações Recebidas (para prestadores) -->
            <div id="avaliacoesRecebidas" class="avaliacoes-container" style="display: none;">
                <h3 style="color: #00ADB5; text-align: left; margin-bottom: 15px;">Avaliações Recebidas</h3>
                <div id="listaAvaliacoes">
                    <!-- As avaliações serão inseridas aqui via JavaScript -->
                </div>
            </div>
        </div>
    </div>

</section>

<script src="utils.js"></script>
<script src="perfil.js"></script>
</body>
</html>
