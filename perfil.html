<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | AjudaAí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

<header class="header">
    <div class="logo-container" style="cursor: pointer;" onclick="window.location.href='home.html'">
        <img src="img/logo.png" alt="AjudaAí Logo" class="logo-side" style="width: 50px; margin-bottom: 0;">
        <h1>AjudaAí</h1>
    </div>

    <!-- HEADER DINÂMICO APÓS LOGIN -->
    <nav class="menu" id="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="home.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="pedidos.html">Meus Pedidos</a>
        <a href="carteira.html">Carteira</a>
        <a href="perfil.html">Meu Perfil</a>
        <a href="#" id="btnLogout">Sair</a>
    </nav>
</header>

<section class="main-container" style="min-height: auto; padding-top: 40px;">

    <div class="login-section register-section">
        <div class="login-card">
            <h2>Meu Perfil</h2>

            <div class="profile-layout">
                <!-- COLUNA ESQUERDA: SIDEBAR -->
                <aside class="profile-sidebar">
                    <div class="profile-pic-container">
                        <img src="img/avatar_padrao.png" alt="Foto de Perfil" id="profilePicPreview">
                        <label for="profilePicInput" class="profile-pic-edit-label" id="editPicLabel">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25Z" /></svg>
                        </label>
                        <input type="file" id="profilePicInput" accept="image/png, image/jpeg" style="display: none;">
                    </div>
                    
                    <button id="btnEditar" class="btn-forgot" style="width: 100%;">Editar Dados</button>

                    <div id="areaTornarPrestador" style="display: none; margin-top: 15px; width: 100%;">
                        <button type="button" id="btnTornarPrestador" class="btn-forgot" style="width: 100%;">Tornar-se Prestador</button>
                    </div>
                </aside>

                <!-- COLUNA DIREITA: CONTEÚDO PRINCIPAL -->
                <div class="profile-main">
                    <form id="perfilForm">
                        <div class="form-grid">
                            <h3 class="section-title full-width">Dados Pessoais</h3>
                            
                            <div class="form-group full-width">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nome" placeholder="Nome completo" required disabled>
                            </div>
                            <div class="form-group">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" placeholder="CPF" required disabled>
                            </div>
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" placeholder="E-mail" required disabled>
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone</label>
                                <input type="tel" id="telefone" placeholder="Telefone" required maxlength="15" disabled>
                            </div>
                            
                            <h3 class="section-title full-width">Endereço</h3>
                            
                            <div class="form-group">
                                <label for="cep">CEP</label>
                                <input type="text" id="cep" placeholder="CEP" required maxlength="9" disabled>
                            </div>
                            <div class="form-group">
                                <label for="rua">Logradouro / Rua</label>
                                <input type="text" id="rua" placeholder="Rua" required disabled>
                            </div>
                            <div class="form-group">
                                <label for="numero">Número</label>
                                <input type="text" id="numero" placeholder="Número" required>
                            </div>
                            <div class="form-group">
                                <label for="complemento">Complemento (Opcional)</label>
                                <input type="text" id="complemento" placeholder="Complemento/Referência" disabled>
                            </div>
                            <div class="form-group">
                                <label for="bairro">Bairro</label>
                                <input type="text" id="bairro" placeholder="Bairro" required disabled>
                            </div>
                            <div class="form-group">
                                <label for="cidade">Cidade</label>
                                <input type="text" id="cidade" placeholder="Cidade" required disabled>
                            </div>
                            <div class="form-group full-width">
                                <label for="estado">Estado</label>
                                <input type="text" id="estado" placeholder="Estado" required disabled>
                            </div>
                        </div>

                        <!-- Se for prestador, mostrar os campos dele -->
                        <div id="camposPrestadorPerfil" style="display: none;" class="form-grid">
                            <h3 class="section-title full-width">Dados Profissionais (Prestador)</h3>
                            
                            <div class="form-group full-width">
                                <label for="categoria">Categoria de Serviço</label>
                                <select id="categoria" disabled>
                                    <option value="" disabled selected>Selecione uma Categoria...</option>
                                    <option value="Limpeza">Limpeza</option>
                                    <option value="Manutenção">Manutenção</option>
                                    <option value="Reformas">Reformas</option>
                                    <option value="Tecnologia">Tecnologia</option>
                                    <option value="Saúde e Beleza">Saúde e Beleza</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="servico">Serviço Prestado</label>
                                <input type="text" id="servico" placeholder="Serviço prestado" disabled>
                            </div>
                            <div class="form-group full-width">
                                <label for="descricao">Descrição Rápida</label>
                                <input type="text" id="descricao" placeholder="Descrição rápida" disabled>
                            </div>
                            <div class="form-group">
                                <label for="valor">Valor Médio (R$)</label>
                                <input type="number" id="valor" placeholder="Valor médio por serviço (R$)" disabled>
                            </div>
                            <div class="form-group">
                                <label for="disponibilidade">Disponibilidade</label>
                                <input type="text" id="disponibilidade" placeholder="Disponibilidade" disabled>
                            </div>
                        </div>

                        <button type="submit" id="btnSalvar" class="btn-login" style="display: none; margin-top: 20px;">Salvar Alterações</button>
                    </form>

                    <!-- Seção de Avaliações Recebidas (para prestadores) -->
                    <div id="avaliacoesRecebidas" class="avaliacoes-container" style="display: none;">
                        <h3 style="color: #00ADB5; text-align: left; margin-bottom: 15px;">Avaliações Recebidas</h3>
                        <div id="listaAvaliacoes">
                            <!-- As avaliações serão inseridas aqui via JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>

<button id="backToTopBtn" class="back-to-top-btn" title="Voltar ao Topo">&#9650;</button>
<footer class="mini-footer">
    &copy; 2026 AjudaAí. Todos os direitos reservados.
</footer>

<script src="utils.js"></script>
<script src="perfil.js"></script>
</body>
</html>
